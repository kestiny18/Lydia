name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to embed in the installer (for example 0.1.2)
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage Windows bundle
        shell: powershell
        run: .\scripts\stage-windows-bundle.ps1

      - name: Smoke test staged bundle
        shell: powershell
        run: |
          cmd /c ".release\windows\bundle\lydia.cmd stop" 2>$null
          cmd /c ".release\windows\bundle\lydia.cmd start"
          Start-Sleep -Seconds 3
          cmd /c ".release\windows\bundle\lydia.cmd status"
          cmd /c ".release\windows\bundle\lydia.cmd stop"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Diagnose ISCC environment
        shell: powershell
        run: |
          $pf = [System.Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $pf "Inno Setup 6\ISCC.exe"
          Write-Host "ISCC: $iscc"
          Write-Host "ISCC exists: $(Test-Path $iscc)"
          if (Test-Path $iscc) { & $iscc /? 2>&1 | Select-Object -First 3 }
          Write-Host "app.ico bytes: $((Get-Item 'build\windows\app.ico').Length)"
          Write-Host "Lydia.iss bytes: $((Get-Item 'build\windows\Lydia.iss').Length)"
          Write-Host "kill.ps1 bytes: $((Get-Item '.release\windows\bundle\lydia-kill.ps1').Length)"

      - name: Build installer
        shell: powershell
        run: |
          $version = "${{ github.event.inputs.release_version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          $env:LYDIA_VERSION = $version
          $logDir = "build\windows\out"
          $logPath = Join-Path $logDir "iscc.log"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "build\windows\Lydia.iss" *>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Inno Setup build failed. Full log:"
            Get-Content $logPath
            exit $LASTEXITCODE
          }

      - name: Upload installer build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-log
          path: build/windows/out/iscc.log
          if-no-files-found: warn

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          version="${{ github.event.inputs.release_version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            build/windows/out/*.exe
