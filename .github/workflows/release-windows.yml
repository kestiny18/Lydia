name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to embed in the installer (for example 0.1.2)
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Stage Windows bundle
        shell: powershell
        run: |
          .\scripts\stage-windows-bundle.ps1
          # Copy app.ico into the ISS source dir so Inno Setup can find IconFile=app.ico
          Copy-Item ".release\windows\bundle\app.ico" "build\windows\app.ico" -Force

      - name: Smoke test staged bundle
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $version = "${{ github.event.inputs.release_version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          $env:LYDIA_VERSION = $version
          $logDir = "build\windows\out"
          $logPath = Join-Path $logDir "iscc.log"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "build\windows\Lydia.iss" *>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Inno Setup build failed. Full log:"
            Get-Content $logPath
            exit $LASTEXITCODE
          }

      - name: Upload installer build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-log
          path: build/windows/out/iscc.log
          if-no-files-found: warn

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          version="${{ github.event.inputs.release_version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            build/windows/out/*.exe
